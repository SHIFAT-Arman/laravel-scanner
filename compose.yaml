services:
  app:
    build:
      context: .
      target: app
    env_file: ${ENV_FILE:-.env.production}
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/html/storage

  queue:
    build:
      context: .
      target: app
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60
    depends_on:
      - app
    env_file: ${ENV_FILE:-.env.production}
    restart: unless-stopped
    stop_grace_period: 70s
    volumes:
      - app-storage:/var/www/html/storage

  web:
    build:
      context: .
      target: web
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  database-tools:
    image: postgres:17-alpine
    profiles: ["ops"]
    env_file: ${ENV_FILE:-.env.production}
    volumes:
      - ./backups:/backups

volumes:
  app-storage:
  caddy-data:
  caddy-config:
